    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #fff9f4; overflow: hidden; }
      #root { min-height: 100dvh; }
      #splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(160deg, #f5ede3 0%, #fff9f4 50%, #e8d5c4 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 9999;
      }
      #splash-logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c4a882, #8b6f5e);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(139,111,94,0.25);
        animation: logoAppear 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards;
      }
      #splash-logo svg {
        width: 40px;
        height: 40px;
        fill: #fff9f4;
      }
      #splash-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.6rem;
        font-weight: 400;
        color: #5c4a3c;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        animation: fadeInUp 0.6s ease 0.3s both;
      }
      #splash-subtitle {
        font-family: 'Jost', system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 300;
        color: #7a6860;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        animation: fadeInUp 0.6s ease 0.5s both;
      }
      #splash-dots {
        display: flex;
        gap: 6px;
        animation: fadeInUp 0.6s ease 0.7s both;
      }
      #splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c4a882;
        animation: pulse 1.4s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes logoAppear {
        from { opacity: 0; transform: scale(0.6); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50%       { opacity: 1;   transform: scale(1.2); }
      }
    </style>
  </head>
